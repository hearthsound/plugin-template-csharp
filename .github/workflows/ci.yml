name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build, check and pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # The .NET 9 SDK ships a mono-toolchain workload manifest whose
      # WorkloadManifest.Wasi.targets fails the build with "The
      # 'wasi-experimental' workload is not supported in .NET 9". The
      # componentize SDK drives the wasi build itself and needs no workload,
      # so the manifest is removed before restore.
      - name: Drop the workload manifest that rejects the wasi build
        run: |
          find /usr/share/dotnet/sdk-manifests -maxdepth 2 -type d \
            -name 'microsoft.net.workload.mono.toolchain.current' -print -exec rm -rf {} +
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the plugin
        run: dotnet build -c Release --nologo
      - name: Install hsplugin
        run: cargo install --locked --git https://github.com/hearthsound/plugin-sdk --tag v0.3.0 hearthsound-plugin-cli
      - name: Check the plugin
        run: hsplugin check
      - name: Run the catalog conformance suite
        run: hsplugin test catalog
      - name: Pack the plugin
        run: hsplugin pack --out-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: hello-catalog.hsplugin
          path: dist/*.hsplugin
